services:
  db:
    image: postgres:17.11
    environment:
      POSTGRES_USER: marketing
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-marketing_local}
      POSTGRES_DB: marketing
    volumes:
      - postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U marketing -d marketing"]
      interval: 3s
      timeout: 3s
      retries: 20
  init:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://marketing:${POSTGRES_PASSWORD:-marketing_local}@db:5432/marketing
    command: ["sh", "-c", "python -m marketing.cli init-db && python -m marketing.cli import-data"]
    depends_on:
      db:
        condition: service_healthy
  api:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://marketing:${POSTGRES_PASSWORD:-marketing_local}@db:5432/marketing
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      init:
        condition: service_completed_successfully
    restart: unless-stopped
  worker:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://marketing:${POSTGRES_PASSWORD:-marketing_local}@db:5432/marketing
    command: ["python", "-m", "marketing.worker"]
    depends_on:
      init:
        condition: service_completed_successfully
    restart: unless-stopped
volumes:
  postgres:
