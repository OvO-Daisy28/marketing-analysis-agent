<text x="822" y="651" font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif" font-size="16" fill="#475569" font-weight="400">数据库备份与恢复验证</text>
<text x="36" y="640" font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif" font-size="16" fill="#475569" font-weight="400">先完成迁移和数据导入，再启动服务。</text>
<text x="36" y="735" font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif" font-size="16" fill="#475569" font-weight="400">公开固定案例继续通过 GitHub Pages 展示；本图只描述真实模型试用环境。</text>
<text x="36" y="768" font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif" font-size="16" fill="#475569" font-weight="400">单 API / Worker 起测；并发、成本和恢复能力通过试验确认，不预设生产 SLA。</text>
