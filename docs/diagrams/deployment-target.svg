<text x="822" y="431" font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif" font-size="16" fill="#475569" font-weight="400">任务状态与持久化卷</text>
<text x="822" y="456" font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif" font-size="16" fill="#475569" font-weight="400">不暴露公网端口</text>
<text x="822" y="481" font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif" font-size="16" fill="#475569" font-weight="400">新增合同与完整快照</text>
<rect x="804" y="590" width="280" height="90" rx="10" fill="#FFF7E8" stroke="#B45309" stroke-width="1.7"/>
