<text x="36" y="723" font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif" font-size="16" fill="#475569" font-weight="400">数据不足、持续失败或预算耗尽时保留结果并明确停止，不将停止标作完成。</text>
