name: public-showcase
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - uses: actions/configure-pages@v5
      - run: npm ci && npm run build
        working-directory: web
        env:
          VITE_SHOWCASE_ONLY: "true"
      - run: |
          npx playwright install --with-deps chromium
          npx vite preview --host 127.0.0.1 --port 4173 > /tmp/showcase.log 2>&1 &
          npx playwright test --grep "public showcase"
        working-directory: web
        env:
          PLAYWRIGHT_BASE_URL: http://localhost:4173/marketing-analysis-agent/
      - uses: actions/upload-pages-artifact@v4
        with:
          path: web/dist
  deploy:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
